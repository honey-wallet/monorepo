[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../keyring/src/fixtures/bunk-v1.json" }]
remappings = [
  "safe/=lib/safe/contracts/",
  "account-abstraction/=lib/account-abstraction/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin/contracts/",
]

[fuzz]
runs = 256

[fmt]
line_length = 100

[lint]
severity = ["high", "med", "low", "code-size"]
ignore = ["test/**"]
