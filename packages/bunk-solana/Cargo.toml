[workspace]
resolver = "2"
members = ["tests/invoker"]
default-members = ["."]

[package]
name = "honey-bunk-solana"
version = "0.1.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "=2.3.0"
solana-system-interface = { version = "=1.0.0", features = ["bincode"] }

[dev-dependencies]
litesvm = "=0.7.1"
solana-sdk = "=2.3.1"
solana-ed25519-program = "=2.2.3"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
bincode = "=1.3.3"
serde_json = "=1.0.154"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
