name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: honey
          POSTGRES_PASSWORD: honey_ci_only
          POSTGRES_DB: honey
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U honey -d honey" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      # Use the fixture server's matching client version, independent of runner packages.
      - name: Configure PostgreSQL backup clients
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/honey-pg-tools"
          for tool in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/honey-pg-tools/$tool" <<'CLIENT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGCONNECT_TIMEOUT "$POSTGRES_CONTAINER" "$(basename "$0")" "$@"
          CLIENT
            chmod 700 "$RUNNER_TEMP/honey-pg-tools/$tool"
          done
          echo "$RUNNER_TEMP/honey-pg-tools" >> "$GITHUB_PATH"
          echo "POSTGRES_CONTAINER=$POSTGRES_CONTAINER" >> "$GITHUB_ENV"
      - name: PostgreSQL and Redis integration
        env:
          TEST_DATABASE_URL: postgres://honey:honey_ci_only@127.0.0.1:5432/honey?sslmode=disable
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo test --locked \
            --test infrastructure --test durability --test preparations \
            --test sealed_preparations --test swap_reviews \
            --test submissions --test redis_application --test price_stream \
            --test trace_export --test rpc_budget --test auth_cleanup --test recovery_auth \
            --test swap_quotes --test polymarket_catalog -- --ignored
          cargo test --locked --lib providers::transport::integration -- --ignored
          cargo test --locked --lib earn_catalog::tests -- --ignored
          cargo test --locked --lib providers::uniswap:: -- --ignored
          cargo test --locked --lib providers::uniswap_execution::tests::persistence -- --ignored
          cargo test --locked --lib uniswap_service:: -- --ignored
          cargo test --locked --lib providers::bridge_status:: -- --ignored
          cargo test --locked --lib bridge_monitor:: -- --ignored

  telemetry:
    name: Telemetry configuration and alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate collector
        run: docker run --rm --network none --read-only -v "$PWD/ops/observability/collector.yaml:/etc/otelcol/config.yaml:ro" otel/opentelemetry-collector:0.163.1 validate --config=/etc/otelcol/config.yaml
      - name: Validate Prometheus and alert behavior
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m --entrypoint promtool -v "$PWD/ops/observability:/etc/prometheus:ro" prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yaml
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m --entrypoint promtool -v "$PWD/ops/observability:/etc/prometheus:ro" prom/prometheus:v3.15.0 test rules /etc/prometheus/alerts.test.yaml

  js:
    name: JS (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm turbo run typecheck test build --filter=!@honey-wallet/server
      - name: Expo doctor
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor
